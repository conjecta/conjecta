# Benchmark provenance manifest for docs/benchmark-results-2026-08.md.
#
# Each [[row]] maps one quantitative claim in the report to the raw result
# file(s) under data/eval-results/ it was aggregated from, plus the command,
# date, and model that produced them. `scripts/build_benchmark_report.py`
# re-computes the aggregates from the sources and compares them against the
# `expected_*` values copied from the report.
#
# status:
#   "verified"   - mapping is confident; the report script recomputes and
#                  compares the numbers (exit non-zero on divergence).
#   "unverified" - the stored data alone cannot mechanically reproduce the
#                  doc number; see `note`. Not a claim the number is wrong.
#
# judge: "numeric" counts records with correct=true; "lean" counts records
# with verification_status="verified".
#
# Trailing {"type": "summary"} records in the result files are metadata
# emitted by the eval runner and are excluded from recomputation.

[[row]]
id = "fast-tier1"
doc = "Headline table: fast (tier1 basics) | n=54 | 100% | 8s / 3.3k tok"
judge = "numeric"
sources = ["fast-20260806-180936.jsonl"]
command = "scripts/run_eval_chain.sh 20260806-180936  # uv run python scripts/evaluate_math_agent.py --config config.toml --dataset data/eval/fast.jsonl --trials 1 --output data/eval-results/fast-20260806-180936.jsonl"
date = "2026-08-06"
model = "gpt-5.6-sol"
expected_n = 54
expected_solved = 54
expected_total = 54
expected_median_seconds = 8.0
expected_median_tokens = 3300.0
status = "unverified"
note = "Doc reports 100% after an offline re-judge with the fixed judge (see 'Judge false rejections' in the doc): the 4 failed cases were judge false rejections. The stored file recomputes to 50/54 = 92.6%, which matches the doc's stated pre-fix score, and the medians (8.4s / 3329 tok) match the doc. The 100% figure itself is not mechanically reproducible from this file without re-running the fixed judge over stored answers."

