name: Lean integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  lean-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install elan (Lean toolchain manager)
        # math-agent-lean-setup shells out to `lake`; GitHub runners have no
        # Lean toolchain preinstalled. elan auto-fetches the toolchain pinned
        # by the workspace's lean-toolchain file.
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install ripgrep
        # The mathlib premise retriever/search tools shell out to `rg`.
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Cache Lean workspace
        uses: actions/cache@v4
        with:
          path: .lean_workspace
          key: lean-${{ runner.os }}-${{ hashFiles('config.toml', 'uv.lock') }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Enable Lean for this run
        # config.example.toml ships with [lean] enabled = false for regular
        # users; the integration job opts in explicitly.
        run: |
          cp config.example.toml config.toml
          sed -i '/^\[lean\]/,/^\[/ s/^enabled = false/enabled = true/' config.toml
          grep -A2 '^\[lean\]' config.toml | head -3

      - name: Prepare Lean and mathlib
        run: math-agent-lean-setup

      - name: Run Lean integration tests
        run: python -m pytest tests/ -q -o addopts= -m integration
