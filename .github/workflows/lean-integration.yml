name: Lean integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  lean-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Lean workspace
        uses: actions/cache@v4
        with:
          path: .lean_workspace
          key: lean-${{ runner.os }}-${{ hashFiles('config.toml', 'uv.lock') }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare Lean and mathlib
        run: math-agent-lean-setup

      - name: Run Lean integration tests
        run: python -m pytest tests/ -q -o addopts= -m integration
